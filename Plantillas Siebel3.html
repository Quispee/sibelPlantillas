<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantillas Siebel</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#d9dde3;--ac:#e8590c;--ok:#2f9e44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2128;--tx:#eceef2;--mu:#9aa3b2;--bd:#343a46}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2128;--tx:#eceef2;--mu:#9aa3b2;--bd:#343a46}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0 8px 0 0}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:14px;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}.seg{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;font-weight:500;font-size:13px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.chip.sm{padding:3px 10px;font-size:12.5px}
#form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
#form>p,.fld.w{grid-column:1/-1}
main{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;padding:10px;max-width:1000px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 2px}
textarea{resize:vertical;min-height:44px}
.note{font-size:13px;color:var(--ac);margin:0 0 4px}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;min-height:120px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.ok{background:var(--ok)}
.mu{color:var(--mu);font-size:13px}
.sticky{position:sticky;top:10px;align-self:start}
</style>
</head>
<body>
<header>
  <h1>Plantillas Siebel</h1>
  <div id="cats" class="row"></div>
  <div id="tabs" class="row" style="width:100%"></div>
</header>
<main>
  <section class="card"><div id="form"></div></section>
  <section class="card sticky">
    <pre id="out"></pre>
    <div class="bar">
      <button id="copy">Copiar</button>
      <button id="clr" class="g">Limpiar</button>
      <button id="new" class="g">Nuevo cliente</button>
      <span id="miss" class="mu"></span>
    </div>
  </section>
</main>
<script>
// Campo: "Etiqueta" | "Etiqueta|op1/op2" (lista) | "Etiqueta=valor" (valor por defecto)
const DEL=["Dirección de entrega (Calle, Jirón, Avenida y numeración)","Especificar tipo y nombre de zona (Urbanización, AAHH, Comité)","Referencias (Av. Principal o cruce con calle)","Distrito","Provincia","Coordenadas","Teléfono para coordinar la entrega","Otro Teléfono (persona que vive o trabaja con el titular)","Correo electrónico del cliente (Obligatorio)"];
const SN="|SI/NO", PERS=["Persona que llama|Titular/Usuario","Nombre","DNI","Número en consulta","Número que llama"];
const CAB=(t,a,s,e)=>["Tipo: "+t,"Área: "+a,"Subárea: "+s,"Estado: "+e];
const ps=s=>{let hid=false;if(s[0]=="~"){hid=true;s=s.slice(1)}let l=s,o=null,d="",sep=false,ref=null;if(s.startsWith("@")){[ref,l]=s.slice(1).split(">");l=l||ref}else if(s.startsWith("—"))sep=true;else if(s.includes("|")){[l,o]=s.split("|");o=o.split("/")}else if(s.includes("=")){[l,d]=s.split(/=(.*)/s)}return{l,o,d,sep,ref,hid}};
const T=[
["NC / OCC","NC / OCC",[],["Modalidad de ajuste|NC/OCC","Número de Entel","Número desde el cual llama el cliente","Motivo","Monto de ajuste","N° recibo relacionado","Periodo de Facturación","Tipo de ajuste|Error detectable/Error NO detectable"],"Antes de ingresar la NC / OCC, validar el tipo de error. No aplica a suscripciones Premium ni Streaming. Recuerda bloquear las suscripciones."],
["Datos","Falla masiva",[...CAB("Problema","Datos (Navegación)","Falla Masiva","Cerrado"),"Problema - Falla Masiva"],["Nro Entel","Servicio(s) o App afectados por falla masiva (Navegación, Voz, etc)","Ubicación del cliente en el momento de la falla (distrito/provincia/departamento)","Fecha inicio del inconveniente","Dirección de Falla"]],
["Datos","Alto tráfico en antena",CAB("Problema","Señal","Alto Tráfico en Antena","Cerrado"),["Nro Entel","Señal de datos en equipo (3G, 4G, 5G)|3G/4G/5G","Antena","Fecha inicio del inconveniente","Detalle del inconveniente","Dirección exacta de falla (mínimo 2 direcciones si es problema en todo lugar)"]],
["Datos","No navega / APN",[...CAB("Problema","Datos (Navegación)","No Navega / APN","Cerrado"),"Problema - APN"],["Nro Entel","APN Inicial","APN Final","Marca y Modelo en uso","Descripción","Dirección de la falla"],"Configuración APN → Nombre: Entel Internet · APN: entel.pe · Tipo: default. Solo después de validar todos los descartes."],
["Datos","Reinicio de datos (act/desact)",[...CAB("Problema","Datos (Navegación)","No Navega / Reiniciar Restricción","Cerrado"),"Problema - Act/Desact de datos solucionado"],["Nro Entel","Modo de red registrado (2G, 3G, 4G, 5G)|2G/3G/4G/5G","Modo Avión Activado (sí o no)|Sí/No","Descripción","Dirección de falla"]],
["Datos","Aprovisionamiento solucionado (bloqueados en OT)",[...CAB("Problema","Datos (Navegación)","No Navega/ Aprovisionamiento","Cerrado"),"Problema - No Navega/Aprovisionamiento solucionado"],["Nro Entel","Plan","Fecha inicio del inconveniente","Nro de orden de barring (si es que se ingresó)","Servicio solucionado","Descripción","Dirección de falla"]],
["Datos","Aprovisionamiento pendiente (validar en OTTO)",[...CAB("Problema","Datos (Navegación)","Aprovisionamiento","Pendiente"),"Problema"],["N° Entel con problema","Marca y Modelo del equipo","N° de contacto","Mensaje de error","Detalle del inconveniente","Pasos realizados para solución","Departamento / Provincia / Distrito","Dirección completa de la falla","Plan","Fecha inicio del inconveniente","Medio de notificación|Correo/Dirección física","Correo electrónico para notificación","Dirección de notificación (si no tiene correo o no autoriza)","Nro de orden de barring (si es que se ingresó)","Servicio bloqueado"]],
["Datos","Plan – consumos/saldos (se queda sin saldo)",[...CAB("Consulta","Consumos y Saldos","Plan- Consumos/Saldos/Vigencia","Cerrado")],["Nro Entel","Estado de la línea","Fecha inicio del inconveniente","Descripción"]],
["Datos","Fair Use (sin datos en alta velocidad)",[...CAB("Consulta","Datos (Navegación)","Fair Use","Cerrado"),"Problema - Fair Use"],["Nro Activo","Plan","Consumo MB","Fair use plan MB","Descripción","Dirección de falla"]],
["Datos","No asignación de beneficios",[...CAB("Consulta","Consumos y Saldos","Plan-Consumos/Saldos/Vigencia","Pendiente"),"#NO ASIGNACION DE BENEFICIOS"],["Nombres","DNI","Número","Ciclo de Facturación","Plan tarifario","Descripción del problema","Saldos no asignados de bucket (GB) – indica con exactitud qué saldo no se asignó"],"Si escala a 2do nivel: derívala al grupo NICCS EXTERNO."],
["Datos","Equipo en blacklist",[...CAB("Consulta","Equipos","Equipos en Blacklist","Cerrado"),"Consulta - Equipo en BlackList"],["Nro Entel","Nro de IMEI","Marca y Modelo en uso","Descripción"]],
["Reclamos","Reclamo",[],["Nombre completo y DNI del titular","Nombre completo y DNI del reclamante","Teléfono de contacto del reclamante","Correo electrónico de notificación","Dirección de notificación (distrito, provincia y departamento indicado por el reclamante)","Referencias","Número Entel por el cual reclama","Nº de recibo","Monto reclamado sin IGV (S/.)","Coordenadas","Fallan todos los servicios (Sí / No)|Sí/No","Si la respuesta es no, indicar qué servicio falla","Fecha-hora del último intento de la conexión o llamada","Mensaje de error","Dirección donde presenta la falla","Distrito/ provincia/departamento","Referencia de la dirección de falla","Características del inmueble (pisos altos, sótanos, área rodeada de cerros, etc.)","Se presentan inconvenientes en interiores (Sí / No)|Sí/No","Se presentan inconvenientes en exteriores (Sí / No)|Sí/No","Detalle del inconveniente"],"Aplicar SAR antes de un reclamo. Valida bien los datos del titular/usuario: no se puede negar un reclamo."],
["Ventas","Portabilidad",["Tipo: Consulta","Área: Procedimientos","Subárea: Otras órdenes","PORTABILIDAD"],["¿Ofrecimiento es venta múltiple?"+SN,"¿Tiene problema con huella?"+SN,"DNI del cliente","N° que se comunica","N° a portar","Padre","Madre","Distrito nacimiento","Tipo de entrega|LOGIXTAL/TIENDA","Plan Ofrecido","Monto de cuota inicial/pago único=5","Fecha de entrega/recojo en tienda","Nombre de la tienda (colocar según excel)","Código de punto de Retiro (obligatorio para retiro en tienda)","Acepta publicidad"+SN,"— DATOS DELIVERY —",...DEL]],
["Ventas","Línea nueva",["Tipo: Consulta","Área: Procedimientos","Subárea: Activación de línea nueva","LÍNEA NUEVA"],["¿Ofrecimiento es venta múltiple?"+SN,"¿Tiene problema con huella?"+SN,"Mes y año de caducidad de DNI","DNI del cliente","N° que se comunica","Padre","Madre","Distrito nacimiento","Tipo de entrega|LOGIXTAL/TIENDA","Plan Ofrecido","Monto de cuota inicial/pago único=5","Fecha de entrega/recojo en tienda","Nombre de la tienda (colocar según excel)","Código de punto de Retiro (obligatorio para retiro en tienda)","Acepta publicidad"+SN,"— DATOS DELIVERY —",...DEL]],
["Ventas","Renovación",["Tipo: Consulta","Área: Procedimientos","Subárea: Activación de línea nueva","RENOVACIÓN"],["¿Ofrecimiento es venta múltiple?"+SN,"¿Tiene problema con huella?"+SN,"Mes y año de caducidad de DNI","DNI del cliente","N° que se comunica","Padre","Madre","Distrito nacimiento","Tipo de entrega|LOGIXTAL/TIENDA","Modelo de equipo","SKU EQUIPO","Modalidad de venta","FE tipo de tarjeta","Monto de cuota inicial/pago único","Monto de cuota VEP","Plazo de cuota VEP","Monto total financiado","Fecha de entrega/recojo en tienda","Nombre de la tienda (colocar según excel)","Código de punto de Retiro (obligatorio para retiro en tienda)","Acepta publicidad"+SN,"— DATOS DELIVERY —",...DEL,"Titular acepta activar nueva garantía"+SN,"Nombre de la Garantía Entel"]],
["Retención","Retención – descuento",["Tipo: Solicitud","Área: Facturación","Subárea: Aplicar dscto por retención","Etiqueta (campo Descripción): RETE_CALL_DSCTOUP_3M"],[...PERS,"Consulta","Solución"],"Cargo fijo ≥ 54.90: dscto 20% x 3 meses. Cargo fijo < 54.90: downselling en plancha captura."]
].map(([g,n,h,f,note])=>({g,n,h,note,f:f.map(ps)}));
const UPT=n=>["📌 PLANTILLA DE UPSELL","","TIPO: Consulta","AREA: Procedimiento","SUBÁREA : Cambio de plan","DESCRIPCIÓN:","✍🏻 Número en consulta: {"+n+"}","✍🏻 Número que llama: {llama}","Consulta: Cambio de plan","Solución: Se genera cambio de plan.","💰 Plan Origen: {Plan Origen}","","📌 PLANTILLA DESCRIPCIÓN","Persona que llama: {Persona que llama}","Nombre: {nombre}","📁 DNI DEL cliente: {dni}","✍🏻 Número en consulta: {"+n+"}","✍🏻 Número que llama: {llama}","Consulta: Cambio de plan","💰 Plan Origen: {Plan Origen}","Solución: Se genera cambio de plan."].join("\n");
T.push({g:"Upsell",n:"Upsell + Descripción",h:[],f:["~Número en consulta","~Número que llama","~Plan Origen","~Persona que llama|Titular/Usuario","~Nombre","~DNI del cliente"].map(ps),tpl:UPT("num"),note:"Va aparte de Portabilidad, Línea nueva y Renovación."});

const $=id=>document.getElementById(id), form=$("form"), out=$("out"), miss=$("miss"), S={};
let cur=0, cat=T[0].g;
const GS=[...new Set(T.map(t=>t.g))];
const PAN=[["nombre","Nombre completo"],["dni","DNI"],["llama","N° que llama"],["num","N° en consulta / a portar"],["mail","Correo"],["tel","Teléfono de contacto"]],SH={},TODAY=new Date().toLocaleDateString("es-PE");
const K=l=>/^Nombres?$/.test(l)?"nombre":/^DNI( del cliente)?$/i.test(l)?"dni":/^(N° que se comunica|Número que llama|Número desde el cual llama el cliente)$/.test(l)?"llama":/^(N° a portar|Número en consulta|Nro Entel|Número de Entel|Nro Activo|Número|N° Entel con problema|Número Entel por el cual reclama)$/.test(l)?"num":/^Correo electrónico (del cliente|de notificación|para notificación)/.test(l)?"mail":/^(Teléfono para coordinar la entrega|N° de contacto|Teléfono de contacto del reclamante)$/.test(l)?"tel":"";
T.forEach(t=>t.f.forEach(f=>{f.k=f.sep||f.ref?"":K(f.l)}));
function val(t,v,i){const f=t.f[i];if(f.ref){const j=t.f.findIndex(y=>!y.ref&&y.l===f.ref);return j<0?"":val(t,v,j)}return f.k?(SH[f.k]||""):(v[i]||"")}
function chip(txt,on,fn,sm){const b=document.createElement("button");b.textContent=txt;b.className="chip"+(sm?" sm":"")+(on?" on":"");b.onclick=fn;return b}
function nav(){
  $("cats").innerHTML="";$("tabs").innerHTML="";
  GS.forEach(gn=>$("cats").appendChild(chip(gn,gn===cat,()=>{cat=gn;cur=T.findIndex(t=>t.g===gn);nav();build()})));
  T.forEach((t,i)=>{if(t.g===cat)$("tabs").appendChild(chip(t.n.replace(" + Delivery + Upsell + Descripción"," (completa)"),i===cur,()=>{cur=i;nav();build()},1))});
}

function vals(){const t=T[cur];return S[cur]||(S[cur]=t.f.map(f=>f.d||(/^Fecha inicio/.test(f.l)?TODAY:"")))}
function build(){
  const t=T[cur],v=vals();form.innerHTML="";
  if(t.note){const p=document.createElement("p");p.className="note";p.textContent=t.note;form.appendChild(p)}
  t.f.forEach((f,i)=>{
    if(f.sep){const p=document.createElement("p");p.className="mu";p.style.marginTop="16px";p.textContent=f.l.split("\n")[0].replace(/—/g,"").trim();form.appendChild(p);return}
    if(f.ref)return;
    const w=document.createElement("div");w.className="fld";const lb=document.createElement("label");lb.textContent=f.l;w.appendChild(lb);form.appendChild(w);
    let el;
    if(f.o){el=document.createElement("div");el.className="seg";f.o.forEach(x=>{const b=chip(x,v[i]===x,()=>{v[i]=v[i]===x?"":x;[...el.children].forEach(c=>c.classList.toggle("on",c.textContent===v[i]));render()},1);b.type="button";el.appendChild(b)})}
    else if(/descrip|detalle|pasos|motivo|soluci|consulta$/i.test(f.l)){el=document.createElement("textarea")}
    else el=document.createElement("input");
    if(!f.o){el.value=f.k?(SH[f.k]||""):v[i];el.oninput=()=>{v[i]=el.value;if(f.k)SH[f.k]=el.value;render()}}if(el.tagName=="TEXTAREA")w.classList.add("w");
    w.appendChild(el);
  });
  render();
}
function fill(t,v,s){return s.replace(/\{(.+?)\}/g,(m,l)=>{if(PAN.some(p=>p[0]===l))return(SH[l]||"").trim();const i=t.f.findIndex(f=>f.l===l);return i<0?"":val(t,v,i).trim()})}
function text(){
  const t=T[cur],v=vals(),L=[...t.h];
  t.f.forEach((f,i)=>{if(f.hid&&f.sep)return;if(f.sep){L.push("",f.l);return}if(f.hid)return;L.push(f.l+": "+val(t,v,i).trim())});
  const s=L.join("\n");return t.tpl?fill(t,v,t.tpl):t.tail?s+"\n\n"+fill(t,v,t.tail):s;
}
function render(){
  const t=T[cur],v=vals();
  out.textContent=text();
  const n=t.f.reduce((a,f,i)=>a+(!f.sep&&!f.ref&&!val(t,v,i).trim()?1:0),0);
  miss.textContent=n?`Faltan ${n} campos`:"Todo completo";
}
$("copy").onclick=async e=>{
  const s=text();
  try{await navigator.clipboard.writeText(s)}catch(_){const r=document.createRange();r.selectNodeContents(out);const x=getSelection();x.removeAllRanges();x.addRange(r);document.execCommand("copy");x.removeAllRanges()}
  const b=e.target;b.textContent="¡Copiado!";b.classList.add("ok");setTimeout(()=>{b.textContent="Copiar";b.classList.remove("ok")},1400);
};
$("clr").onclick=()=>{delete S[cur];build()};
$("new").onclick=()=>{for(const k in SH)delete SH[k];for(const k in S)delete S[k];build()};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();const a=[...document.querySelectorAll("#cg input,#form input,#form textarea")],n=a[a.indexOf(e.target)+1];if(n)n.focus()}});
nav();
build();
</script>
</body>
</html>
